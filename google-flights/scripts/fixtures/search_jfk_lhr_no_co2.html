<!-- Trimmed capture of a real search page: JFK->LHR 2026-10-20, one way,
     1 adult, gl=CA curr=CAD, captured 2026-09-08.

     Captured for two shapes the other fixtures cannot reach.

       * AN ITINERARY WITH NO CO2 ESTIMATE. Google publishes emissions for
         almost everything, so the absent case never appeared in a capture
         until this one: the LEVEL/Vueling option (fare 403) has a null in the
         grams slot and a null in the percent-vs-typical slot, while the
         route's TYPICAL figure (427000 g) is still present beside them. That
         mixture is the trap -- a parser that falls back to the typical figure,
         or that reads the neighbouring slot, reports a real-looking emissions
         number for a flight Google declined to estimate, and an emissions
         filter then either keeps or drops it on invented data. Wanted:
         co2_grams None, co2_percent_vs_typical None, co2_typical_grams 427000.

       * A LEG WITH NO AMENITY DATA AT ALL. The first leg of that same option
         (LL2628 JFK-BCN) carries no legroom, no aircraft type and no per-leg
         emissions, while its second leg (VY6652 BCN-LHR) carries all three.
         A legroom filter must not treat "not stated" as "meets the minimum".

     The same option is also mixed-carrier: Google labels it "multi" -- not an
     airline code -- and names LEVEL and Vueling, flown LL then VY.

     The controls are the British Airways nonstop (fare 406, 433000 g) and the
     Aer Lingus JFK-DUB-LHR connection (fare 406, 440000 g), both fully
     populated. The two share a fare, so identify options by carrier, not by
     price.

     The ds:1 payload is verbatim Google output with the itinerary list cut to
     three options, the price history to six points, and the nearby-airport,
     baggage and accessibility blocks (indices 17, 11, 26) dropped. ds:0 is
     verbatim -- the query-echo oracle reads it.

     Regenerate rather than hand-editing. -->
